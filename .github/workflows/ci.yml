name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install just
        uses: taiki-e/install-action@just

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality-tools-v1
          cache-all-crates: true

      - name: install emmylua_check
        uses: taiki-e/install-action@v2
        with:
          tool: emmylua_check

      - name: install luafmt
        env:
          CARGO_TARGET_DIR: target/ci/emmylua_formatter
        run: |
          if ! command -v luafmt >/dev/null 2>&1; then
            cargo install --git https://github.com/EmmyLuaLs/emmylua-analyzer-rust --rev d7d5dcbf emmylua_formatter
          fi

      - name: run quality checks
        run: just ci-quality

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nvim: [stable, nightly]
    steps:
      - uses: actions/checkout@v5

      - name: install just
        uses: taiki-e/install-action@just

      - name: install neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: setup test deps
        run: just setup

      - name: run tests
        run: just test
