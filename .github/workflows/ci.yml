name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v2

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: install luafmt
        uses: baptiste0928/cargo-install@v3
        with:
          crate: emmylua_formatter
          git: https://github.com/EmmyLuaLs/emmylua-analyzer-rust
          rev: d7d5dcbf
          cache-key: luafmt-v1

      - name: run format check
        timeout-minutes: 1
        run: mise run format-check

  lint:
    # if: false # Temporarily disabled while investigating emmylua_check timeout/hang in CI.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nvim: [v0.12.2, nightly]
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v2

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: install emmylua_check
        uses: baptiste0928/cargo-install@v3
        with:
          crate: emmylua_check
          git: https://github.com/EmmyLuaLs/emmylua-analyzer-rust
          commit: 7c96abd684c3d840719c0d9d24ada5e5b1b81288
          cache-key: emmylua-check-v1

      - name: install neovim
        uses: rhysd/action-setup-vim@v1
        id: vim
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: setup lint deps
        run: mise run setup

      - name: run lint
        timeout-minutes: 1
        # timeout-minutes: 10
        run: |
          vim_dir="${{ steps.vim.outputs.vim-dir }}/runtime"
          sed -i "s|/usr/share/nvim/runtime|${vim_dir}|g" .emmyrc.json
          emmylua_check -c .emmyrc.json  lua tests --verbose

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nvim: [v0.12.2, nightly]
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v2

      - name: install neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: run tests
        run: mise run test
