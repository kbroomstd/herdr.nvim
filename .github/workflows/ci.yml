name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: install emmylua_check
        uses: baptiste0928/cargo-install@v3
        with:
          crate: emmylua_check
          cache-key: emmylua-check-v1

      - name: install luafmt
        uses: baptiste0928/cargo-install@v3
        with:
          crate: emmylua_formatter
          git: https://github.com/EmmyLuaLs/emmylua-analyzer-rust
          rev: d7d5dcbf
          cache-key: luafmt-v1

      - name: run ci-lint
        timeout-minutes: 1
        run: just ci-lint

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: install luafmt
        uses: baptiste0928/cargo-install@v3
        with:
          crate: emmylua_formatter
          git: https://github.com/EmmyLuaLs/emmylua-analyzer-rust
          rev: d7d5dcbf
          cache-key: luafmt-v1

      - name: run format check
        timeout-minutes: 1
        run: just format-check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nvim: [stable, nightly]
    steps:
      - uses: actions/checkout@v6

      - name: install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: install neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: setup test deps
        run: just setup

      - name: run tests
        run: just test
